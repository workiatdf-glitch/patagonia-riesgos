version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: clima_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: patagonia_db
      POSTGRES_USER: patagonia_user
      POSTGRES_PASSWORD: patagonia_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patagonia_user -d patagonia_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: clima_backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://patagonia_user:patagonia_password@db:5432/patagonia_db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # Se comenta el volumen para evitar el error de deadlock (Resource deadlock would occur)
    # de VirtioFS en macOS en carpetas sincronizadas con iCloud (~/Documents).
    # volumes:
    #   - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: clima_frontend
    ports:
      - "5174:5173"
    command: npm run dev -- --host 0.0.0.0
    # Se comentan los volúmenes para evitar el error de deadlock (Resource deadlock would occur)
    # de VirtioFS en macOS cuando el proyecto está en carpetas sincronizadas con iCloud (~/Documents).
    # Para desarrollo con recarga rápida, mover el proyecto fuera de Documents/ y reactivar los volúmenes.
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    depends_on:
      - backend

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: clima_proxy
    ports:
      - "8082:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
